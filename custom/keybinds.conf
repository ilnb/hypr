#!

##! Window
bind = Super+Shift, Q, forcekillactive # Force close window
bind = Super, Backspace, global, quickshell:sessionToggle # Toggle session menu
bind = Super, Delete, exit # [hidden] Kill hyprland session
bind = Super, W, togglefloating, # Toggle float
bind = Super, H, movefocus, l # [hidden] Move focus left
bind = Super, L, movefocus, r # [hidden] Move focus right
bind = Super, K, movefocus, u # [hidden] Move focus up
bind = Super, J, movefocus, d # [hidden] Move focus down
$moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
#/# bind = Ctrl+Super, Hash,, # Move window (h, j, k, l)
binde = Ctrl+Super, H, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l # [hidden]
binde = Ctrl+Super, L, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r # [hidden]
binde = Ctrl+Super, K, exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u # [hidden]
binde = Ctrl+Super, J, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d # [hidden]

##! Utilities
bind = Super, comma, exec, pkill -x rofi || $scriptPath/glyph-picker.sh # Glyph picker
bind = Super, B, exec, pkill -x rofi || $scriptPath/pdf-selector.sh # Pdf selector
bind = Super+Shift, B, exec, pkill -x rofi || $scriptPath/pdf-selector.sh hidden # [hidden] Include all hidden dirs
bind = Super, P, global, quickshell:regionScreenshot # Screen snip
bind = Super+Shift, U, exec, $scriptPath/update.sh up # Update the system

##! Media
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # [hidden] Toggle audio mute
bindel = , F11, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # Decrease volume
bindel = , F12, exec, wpctl set-volume -l 1.53 @DEFAULT_AUDIO_SINK@ 5%+ # Increase volume
bindl  = , code:248, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle # Toggle microphone mute

#!

##! Apps
# bind = Super, Return, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "${TERMINAL}" "wezterm" "kitty -1" "ghostty" # Terminal
# bind = Super, T, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "${TERMINAL}" "wezterm" "kitty -1" "ghostty" # [hidden] (terminal) (alt)
bind = Super, T, exec, $TERMINAL # Terminal
bind = Super, C, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "$scriptPath/wezterm.sh start -- sh -c nvim" "kitty -1 nvim" # Code editor
bind = Super, F, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "zen-browser" "firefox" "brave" "librewolf" # Browser
bindd = Super+Shift, M, spotify, exec, flatpak run com.spotify.Client # Spotify
bindd = Super, D, discord, exec, vesktop # Discord
bind = Super+Shift, C, exec, env WC_KB=1 $scriptPath/wayclick.sh # [hidden] Toggle wayclick

##! Workspace
#/# bind = Super, Hash,, # Go to workspace # (1, 2, 3...)
bind = Super, 1, workspace, 1 # [hidden]
bind = Super, 2, workspace, 2 # [hidden]
bind = Super, 3, workspace, 3 # [hidden]
bind = Super, 4, workspace, 4 # [hidden]
bind = Super, 5, workspace, 5 # [hidden]
bind = Super, 6, workspace, 6 # [hidden]
bind = Super, 7, workspace, 7 # [hidden]
bind = Super, 8, workspace, 8 # [hidden]
bind = Super, 9, workspace, 9 # [hidden]
bind = Super, 0, workspace, 10 # [hidden]
bind = Super+Alt, n, workspace, r+1 # Next workspace
bind = Super+Alt, p, workspace, r-1 # Previous workspace
#/# bind = Super+Shift, Hash,, # Send to workspace # (1, 2, 3...) silent
bindd = Super+Shift, 1, $d move to workspace 1, movetoworkspace, 1 # [hidden]
bindd = Super+Shift, 2, $d move to workspace 2, movetoworkspace, 2 # [hidden]
bindd = Super+Shift, 3, $d move to workspace 3, movetoworkspace, 3 # [hidden]
bindd = Super+Shift, 4, $d move to workspace 4, movetoworkspace, 4 # [hidden]
bindd = Super+Shift, 5, $d move to workspace 5, movetoworkspace, 5 # [hidden]
bindd = Super+Shift, 6, $d move to workspace 6, movetoworkspace, 6 # [hidden]
bindd = Super+Shift, 7, $d move to workspace 7, movetoworkspace, 7 # [hidden]
bindd = Super+Shift, 8, $d move to workspace 8, movetoworkspace, 8 # [hidden]
bindd = Super+Shift, 9, $d move to workspace 9, movetoworkspace, 9 # [hidden]
bindd = Super+Shift, 0, $d move to workspace 10, movetoworkspace, 10 # [hidden]
#/# bind = Super+Ctrl+Alt, Hash,, # Move to workspace (l, h)
bind = Super+Ctrl+Alt, l, movetoworkspace, r+1 # [hidden]
bind = Super+Ctrl+Alt, h, movetoworkspace, r-1 # [hidden]
