# see https://wiki.hyprland.org/configuring/keywords/ for more
# example binds, see https://wiki.hyprland.org/configuring/binds/ for more

# Grouping of binds for easier management
#  $d=[Group Name|Subgroup Name1|Subgroup Name2|...]
# '$d' is a variable that is used to group binds together (or use another variable)
# This is only for organization purposes and is not a defined hyprland variable
# What we did here is to modify the Description of the binds to include the group name
# The $d will be parsed as a separate key to be use for a GUI or something pretty
# [Main|Subgroup1|Subgroup2|...]
# Main - The main groupname
# Subgroup1.. - The subgroup names can be use to avoid repeating the same description

#*  Variables 
# Default if commented out
# Assign apps
$TERMINAL = wezterm
$EDITOR = nvim
$EXPLORER = thunar
$BROWSER = zen-browser
$scrPath = $HOME/.local/lib/hyde

# modifications from the end4 config
unbind = Super, K
bindd = Super+Shift, K, Toggle on-screen keyboard, global, quickshell:oskToggle # Toggle on-screen keyboard

unbind = Super, B
unbind = Super, O
unbind = Super, J
bindd = Super Alt_R, Control_R, Toggle bar, global, quickshell:barToggle # Toggle bar

unbind = Super, L
bindld = Super+Shift, L, Suspend system, exec, systemctl suspend || loginctl suspend # Sleep

unbind = Super, Return
# bind = Super, Return, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "${TERMINAL}" "wezterm" "kitty -1" "ghostty" # Terminal
unbind = Super, T
bind = Super, T, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "${TERMINAL}" "wezterm" "kitty -1" "ghostty" # [hidden] (terminal) (alt)

unbind = Ctrl+Super+Alt, Right
unbind = Ctrl+Super+Alt, Left
unbind = Super, Page_Down
unbind = Super, Page_Up
unbind = Ctrl+Super, Page_Down
unbind = Ctrl+Super, Page_Up
unbind = Super, mouse_up
unbind = Super, mouse_down
unbind = Ctrl+Super, mouse_up
unbind = Ctrl+Super, mouse_down

$wbar_reload = 1 # if variable is defined and not "", it's true

$wm=Window Management
$d=[$wm]
bindd = Super, Q, $d close focused window, exec, $scrPath/dontkillsteam.sh
bindd = Alt, F4, $d force close focused window, forcekillactive
bindd = Super, Delete, $d kill hyprland session, exit
bindd = Super, W, $d toggle float, togglefloating, #
bindd = Super, G, $d toggle group, togglegroup
bindd = Alt, Return, $d toggle fullscreen, fullscreen
bindd = Super Shift, F, $d toggle pin on focused window, exec, $scrPath/windowpin.sh
bindd = Alt, Backspace, $d logout menu, exec, $scrPath/logoutlaunch.sh
bindd = Super, Backspace, $d logout menu, exec, $scrPath/logoutlaunch.sh
# hyprlang if wbar_reload
bindd = Alt_R, Control_R, $d toggle waybar and reload config, exec, killall waybar || (env reload_flag=1 $scrPath/wbarconfgen.sh)
# hyprlang endif
# hyprlang if !wbar_reload
bindd = Alt_R, Control_R, toggle waybar, exec, killall waybar || waybar # toggle waybar without reloading, this is faster
# hyprlang endif
bindd = Super Alt_R, Control_R, toggle caelestia, exec, killall qs || caelestia shell # reload caelestia

$d=[$wm|Group Navigation]
bindd = Super Alt_R, H, $d change active group backwards, changegroupactive, b
bindd = Super Alt_R, L, $d change active group forwards, changegroupactive, f

$d=[$wm|Change focus]
bindd = Super, H, $d focus left, movefocus, l
bindd = Super, L, $d focus right , movefocus, r
bindd = Super, K, $d focus up , movefocus, u
bindd = Super, J, $d focus down, movefocus, d
bindd = Alt, TAB, $d focus , movefocus, d

$d=[$wm|Resize Active Window]
bindde = Super Shift, Right, $d resize window right , resizeactive, 30 0
bindde = Super Shift, Left, $d resize window left, resizeactive, -30 0
bindde = Super Shift, Up, $d resize window up, resizeactive, 0 -30
bindde = Super Shift, Down, $d resize  window down, resizeactive, 0 30

$d=[$wm|Move active window across workspace]
$moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
bindde = Super Control, H, Move active window to the left, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l
bindde = Super Control, L, Move active window to the right, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r
bindde = Super Control, K, Move active window up, exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u
bindde = Super Control, J, Move active window down, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d

$d=[$wm|Move & Resize with mouse]
binddm = Super, mouse:272, $d hold to move window, movewindow
binddm = Super, mouse:273, $d hold to resize window, resizewindow
binddm = Super, Z, $d hold to move window, movewindow
binddm = Super, X, $d hold to resize window, resizewindow

# Toggle focused window split
$d=[$wm]
bindd = Super Shift, J, $d toggle split, togglesplit

$l=Launcher
$d=[$l|Apps]
bindd = Super, T, $d terminal emulator, exec, $TERMINAL
bindd = Super, E, $d file explorer, exec, $EXPLORER
bindd = Super, C, $d text editor, exec, $EDITOR
bindd = Super, F, $d web browser, exec, $BROWSER
# bindd = Super, M, $d spotify (adblock), exec, env LD_PRELOAD=/usr/lib/spotify-adblock.so spotify --uri=%U
# bindd = Super, M, $d spotify, exec, spotify
bindd = Super, M, $d spotify, exec, flatpak run com.spotify.Client
# bindd = Super, D, $d discord, exec, env DISCORD_DISABLE_WAYLAND=1 discord
bindd = Super, D, $d discord, exec, vesktop
bindd = Super, I, $d anki, exec, anki
bindd = Super, N, $d iwdgui, exec, iwdgui
bindd = Control Shift, Escape, $d system monitor, exec, $scrPath/sysmonitor.sh

$d=[$l|Rofi menus]
$rofi-launch=$scrPath/rofilaunch.sh
bindd = Super, comma, $d emoji  picker, exec, pkill -x rofi || $scrPath/emoji-picker.sh # launch emoji picker
bindd = Super, period, $d glyph picker, exec, pkill -x rofi || $scrPath/glyph-picker.sh # launch glyph picker
bindd = Super, V, $d clipboard,  exec, pkill -x rofi || $scrPath/cliphist.sh -c # launch clipboard,
bindd = Super Shift, V, $d clipboard manager, exec, pkill -x rofi || $scrPath/cliphist.sh # launch clipboard Manager
bindd = Super Shift, A, $d select rofi launcher, exec, pkill -x rofi || $scrPath/rofiselect.sh # launch select menu
bindd = Super Alt, A, $d animation style, exec, pkill -x rofi || $scrPath/animations.sh -S # launch animations Manager
bindd = Super, B, $d pdf selector, exec, pkill -x rofi || $scrPath/pdf-selector.sh # opens selected pdf in zathura
bindd = Super Shift, B, $d pdf selector, exec, pkill -x rofi || $scrPath/pdf-selector.sh hidden # include all hidden dirs

$hc=Hardware Controls
$d=[$hc|Audio]
binddl  = , F10, $d toggle mute output, exec, $scrPath/volumecontrol.sh -o m # toggle audio mute
binddl  = , XF86AudioMute,$d  toggle mute output, exec, $scrPath/volumecontrol.sh -o m # toggle audio mute
binddel = , F11, $d decrease volume, exec, $scrPath/volumecontrol.sh -o d # decrease volume
binddel = , F12, $d increase volume, exec, $scrPath/volumecontrol.sh -o i # increase volume
binddl  = , XF86AudioMicMute,$d un/mute microphone, exec, $scrPath/volumecontrol.sh -i m # toggle microphone mute
binddel = , XF86AudioLowerVolume, $d decrease volume, exec, $scrPath/volumecontrol.sh -o d # decrease volume
binddel = , XF86AudioRaiseVolume, $d increase volume, exec, $scrPath/volumecontrol.sh -o i # increase volume

$d=[$hc|Media]
binddl  = , XF86AudioPlay,$d play media, exec, playerctl play-pause # toggle between media play and pause
binddl  = , XF86AudioPause,$d pause media, exec, playerctl play-pause # toggle between media play and pause
binddl  = , XF86AudioNext,$d next media, exec, playerctl next # media next
binddl  = , XF86AudioPrev,$d  previous media, exec, playerctl previous # media previous

$d=[$hc|Brightness]
binddel = , XF86MonBrightnessUp, $d increase brightness, exec, $scrPath/brightnesscontrol.sh i # increase brightness
binddel = , XF86MonBrightnessDown, $d decrease brightness, exec, $scrPath/brightnesscontrol.sh d # decrease brightness

$ut=Utilities
$d=[$ut]
bindd = Super Alt, G, $d game mode, exec, $scrPath/gamemode.sh # disable hypr effects for gamemode
bindd = Super, C, $d wayclick, exec, env WC_KB=1 $scrPath/wayclick.sh # toggle wayclick

$d=[$ut|Screen Capture]
bindd = Super Shift, P, $d color picker, exec, hyprpicker -an # Pick color (Hex) >> clipboard#
bindd = Super, P, $d snip screen , exec, $scrPath/screenshot.sh s # partial screenshot capture
bindd = Super Control, P, $d freeze and snip screen, exec, $scrPath/screenshot.sh sf # partial screenshot capture (frozen screen)
# binddl = Super Alt, P, $d print monitor, exec, $scrPath/screenshot.sh m # monitor screenshot capture
binddl = , Print, $d print all monitors, exec, $scrPath/screenshot.sh p # all monitors screenshot capture

# TODO Make a main rofi menu for these selectors
$rice=Theming and Wallpaper
$d=[$rice]
bindd = Super Alt, Right, $d next global wallpaper, exec, $scrPath/wallpaper.sh -Gn # next global wallpaper
bindd = Super Alt, Left, $d previous global wallpaper, exec, $scrPath/wallpaper.sh -Gp # previous global wallpaper
bindd = Super Shift, W, $d select wallpaper, exec, pkill -x rofi || $scrPath/wallpaper.sh -SG # launch wallpaper select menu
bindd = Super Alt, Up, $d next waybar layout, exec, $scrPath/wbarconfgen.sh n # next waybar mode
bindd = Super Alt, Down, $d previous waybar layout, exec, $scrPath/wbarconfgen.sh p # previous waybar mode
bindd = Super Shift, R, $d wallbash mode selector, exec, pkill -x rofi || $scrPath/wallbashtoggle.sh -m # launch wallbash mode select menu
bindd = Super Shift, T, $d select a theme, exec, pkill -x rofi || $scrPath/theme.select.sh # launch theme select menu

$ws=Workspaces
$d=[$ws|Navigation]
bindd = Super, 1, $d navigate to workspace 1, workspace, 1
bindd = Super, 2, $d navigate to workspace 2, workspace, 2
bindd = Super, 3, $d navigate to workspace 3, workspace, 3
bindd = Super, 4, $d navigate to workspace 4, workspace, 4
bindd = Super, 5, $d navigate to workspace 5, workspace, 5
bindd = Super, 6, $d navigate to workspace 6, workspace, 6
bindd = Super, 7, $d navigate to workspace 7, workspace, 7
bindd = Super, 8, $d navigate to workspace 8, workspace, 8
bindd = Super, 9, $d navigate to workspace 9 , workspace, 9
bindd = Super, 0, $d navigate to workspace 10, workspace, 10

$d=[$ws|Navigation|Relative workspace]
bindd = Super Alt, n, $d change active workspace forwards, workspace, r+1
bindd = Super Alt, p, $d change active workspace backwards, workspace, r-1

$d=[$ws|Navigation]
bindd = Super Control, Down, $d navigate to the nearest empty workspace, workspace, empty

$d=[$ws|Move window to workspace]
bindd = Super Shift, 1, $d move to workspace 1, movetoworkspace, 1
bindd = Super Shift, 2, $d move to workspace 2, movetoworkspace, 2
bindd = Super Shift, 3, $d move to workspace 3, movetoworkspace, 3
bindd = Super Shift, 4, $d move to workspace 4, movetoworkspace, 4
bindd = Super Shift, 5, $d move to workspace 5, movetoworkspace, 5
bindd = Super Shift, 6, $d move to workspace 6, movetoworkspace, 6
bindd = Super Shift, 7, $d move to workspace 7, movetoworkspace, 7
bindd = Super Shift, 8, $d move to workspace 8, movetoworkspace, 8
bindd = Super Shift, 9, $d move to workspace 9, movetoworkspace, 9
bindd = Super Shift, 0, $d move to workspace 10, movetoworkspace, 10

$d=[$ws]
bindd = Super Control+Alt, L, $d move window to next relative workspace, movetoworkspace, r+1
bindd = Super Control+Alt, H, $d move window to previous relative workspace, movetoworkspace, r-1

$d=[$ws|Navigation]
bindd = Super, Right, $d next workspace, workspace, e+1
bindd = Super, Left, $d previous workspace, workspace, e-1

$d=[$ws|Navigation|Special workspace]
bindd = Super Shift, S, $d move to scratchpad, movetoworkspace, special
bindd = Super Alt, S, $d move to scratchpad (silent), movetoworkspacesilent, special
bindd = Super, S, $d toggle scratchpad, togglespecialworkspace

$d=[$ws|Navigation|Move window silently]
bindd = Super Alt, 1, $d move to workspace 1  (silent), movetoworkspacesilent, 1
bindd = Super Alt, 2, $d move to workspace 2  (silent), movetoworkspacesilent, 2
bindd = Super Alt, 3, $d move to workspace 3  (silent), movetoworkspacesilent, 3
bindd = Super Alt, 4, $d move to workspace 4  (silent), movetoworkspacesilent, 4
bindd = Super Alt, 5, $d move to workspace 5  (silent), movetoworkspacesilent, 5
bindd = Super Alt, 6, $d move to workspace 6  (silent), movetoworkspacesilent, 6
bindd = Super Alt, 7, $d move to workspace 7  (silent), movetoworkspacesilent, 7
bindd = Super Alt, 8, $d move to workspace 8  (silent), movetoworkspacesilent, 8
bindd = Super Alt, 9, $d move to workspace 9  (silent), movetoworkspacesilent, 9
bindd = Super Alt, 0, $d move to workspace 10 (silent), movetoworkspacesilent, 10

$d=#! unset the group name
