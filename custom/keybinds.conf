# see https://wiki.hyprland.org/configuring/keywords/ for more
# example binds, see https://wiki.hyprland.org/configuring/binds/ for more

# Grouping of binds for easier management
#  $d=[Group Name|Subgroup Name1|Subgroup Name2|...]
# '$d' is a variable that is used to group binds together (or use another variable)
# This is only for organization purposes and is not a defined hyprland variable
# What we did here is to modify the Description of the binds to include the group name
# The $d will be parsed as a separate key to be use for a GUI or something pretty
# [Main|Subgroup1|Subgroup2|...]
# Main - The main groupname
# Subgroup1.. - The subgroup names can be use to avoid repeating the same description

#*  Variables 
# Default if commented out
# Assign apps
$EDITOR = nvim
$EXPLORER = thunar
$BROWSER = zen-browser
$scriptPath = $HOME/.config/hypr/custom/scripts
$TERMINAL = $scriptPath/wezterm.sh

# modifications from the end4 config
unbind = Ctrl+Super+Alt, Right
unbind = Ctrl+Super+Alt, Left
unbind = Super+Shift, Left
unbind = Super+Shift, Right
unbind = Super, Page_Down
unbind = Super, Page_Up
unbind = Ctrl+Super, Page_Down
unbind = Ctrl+Super, Page_Up
unbind = Super, mouse_up
unbind = Super, mouse_down
unbind = Ctrl+Super, mouse_up
unbind = Ctrl+Super, mouse_down
unbind = Super, B
unbind = Super, O
unbind = Super, F
unbind = Super+Shift, C
unbind = Ctrl+Super, P

unbind = Super+Shift, B
unbind = Super+Shift, P
bindl = Super+Shift, P, exec, playerctl previous # Previous track
bindl= Super+Shift, Space, exec, playerctl play-pause # Play/pause media

unbind = Super, C
bind = Super, C, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "$scriptPath/wezterm.sh start -- sh -c nvim" "kitty -1 nvim" # Code editor

unbind = Super, D
unbind = Super+Shift, M
bind = Super, X, fullscreen, 1 # Maximize

unbind = Super, K
bindd = Super+Shift, K, Toggle on-screen keyboard, global, quickshell:oskToggle # Toggle on-screen keyboard

unbind = Super, J
bindd = Super+Shift, J, Toggle bar, global, quickshell:barToggle # Toggle bar

unbind = Super, L
unbind = Super+Shift, L
bindd = Super+Shift, L, Lock, exec, loginctl lock-session # Lock
bindld = Super+Alt, L, Suspend system, exec, systemctl suspend || loginctl suspend # Sleep

unbind = Super, Return
# bind = Super, Return, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "${TERMINAL}" "wezterm" "kitty -1" "ghostty" # Terminal
unbind = Super, T
# bind = Super, T, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "${TERMINAL}" "wezterm" "kitty -1" "ghostty" # [hidden] (terminal) (alt)
bindd = Super, T, terminal emulator, exec, $TERMINAL # Terminal

unbind = Super, W
bind = Super, F, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "zen-browser" "firefox" "brave" "librewolf" # Browser

$wm=Window Management
$d=[$wm]
bind = Super+Shift, Q, forcekillactive # Force close window
bindd = Super, Delete, $d kill hyprland session, exit # Kill hyprland session
bindd = Super, W, $d toggle float, togglefloating, # Toggle float
bindd = Alt, Return, $d toggle fullscreen, fullscreen, 0 # Toggle fullscreen
bindd = Super+Shift, F, $d toggle pin on focused window, exec, $scriptPath/windowpin.sh # Pin focused window

bind = Super, H, movefocus, l # [hidden] Move focus left
bind = Super, L, movefocus, r # [hidden] Move focus right
bind = Super, K, movefocus, u # [hidden] Move focus up
bind = Super, J, movefocus, d # [hidden] Move focus down

$moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
binde = Super+Ctrl, H, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l # Move window left
binde = Super+Ctrl, L, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r # Move window right
binde = Super+Ctrl, K, exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u # Move window up
binde = Super+Ctrl, J, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d # Move window down

bindm = Super+Ctrl, mouse:272, resizewindow # Resize window using mouse
bindm = Super, Z, movewindow # Move window using mouse

bind = Super+Shift, J, togglesplit # Toggle focused window split

# bindd = Super+Shift, M, $d spotify (adblock), exec, env LD_PRELOAD=/usr/lib/spotify-adblock.so spotify --uri=%U
# bindd = Super+Shift, M, $d spotify, exec, spotify
bindd = Super+Shift, M, $d spotify, exec, flatpak run com.spotify.Client
# bindd = Super, D, $d discord, exec, env DISCORD_DISABLE_WAYLAND=1 discord
bindd = Super, D, $d discord, exec, vesktop

$d=[$l|Rofi menus]
bindd = Super, comma, $d glyph picker, exec, pkill -x rofi || $scriptPath/glyph-picker.sh # launch glyph picker
bindd = Super, B, $d pdf selector, exec, pkill -x rofi || $scriptPath/pdf-selector.sh # opens selected pdf in zathura
bindd = Super+Shift, B, $d pdf selector, exec, pkill -x rofi || $scriptPath/pdf-selector.sh hidden # include all hidden dirs

bindl  = , F10, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # toggle audio mute
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle # [hidden] toggle audio mute
bindel = , F11, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- # decrease volume
bindel = , F12, exec, wpctl set-volume -l 1.53 @DEFAULT_AUDIO_SINK@ 5%+ # increase volume
bindl  = , code:248, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle # [hidden] toggle microphone mute
bindl  = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle # toggle microphone mute

bind = Super+Shift, C, exec, env WC_KB=1 $scriptPath/wayclick.sh # Toggle wayclick

$d=[$ut|Screen Capture]
bindd = Super+Ctrl, P, $d color picker, exec, hyprpicker -a # Pick color (Hex) >> clipboard
bindd = Super, P, $d freeze and snip screen, exec, $scriptPath/screenshot.sh sf # partial screenshot capture (frozen screen)
# binddl = Super+Alt, P, $d print monitor, exec, $scriptPath/screenshot.sh m # monitor screenshot capture
binddl = , Print, $d print all monitors, exec, $scriptPath/screenshot.sh p # all monitors screenshot capture

#/# bind = Super, Hash,, # Go to workspace # (1, 2, 3...)
bind = Super, 1, workspace, 1 # [hidden]
bind = Super, 2, workspace, 2 # [hidden]
bind = Super, 3, workspace, 3 # [hidden]
bind = Super, 4, workspace, 4 # [hidden]
bind = Super, 5, workspace, 5 # [hidden]
bind = Super, 6, workspace, 6 # [hidden]
bind = Super, 7, workspace, 7 # [hidden]
bind = Super, 8, workspace, 8 # [hidden]
bind = Super, 9, workspace, 9 # [hidden]
bind = Super, 0, workspace, 10 # [hidden]
bind = Super+Alt, n, workspace, r+1
bind = Super+Alt, p, workspace, r-1

#/# bind = Super+Shift, Hash,, # Send to workspace # (1, 2, 3...) silent
bindd = Super+Shift, 1, $d move to workspace 1, movetoworkspace, 1 # [hidden]
bindd = Super+Shift, 2, $d move to workspace 2, movetoworkspace, 2 # [hidden]
bindd = Super+Shift, 3, $d move to workspace 3, movetoworkspace, 3 # [hidden]
bindd = Super+Shift, 4, $d move to workspace 4, movetoworkspace, 4 # [hidden]
bindd = Super+Shift, 5, $d move to workspace 5, movetoworkspace, 5 # [hidden]
bindd = Super+Shift, 6, $d move to workspace 6, movetoworkspace, 6 # [hidden]
bindd = Super+Shift, 7, $d move to workspace 7, movetoworkspace, 7 # [hidden]
bindd = Super+Shift, 8, $d move to workspace 8, movetoworkspace, 8 # [hidden]
bindd = Super+Shift, 9, $d move to workspace 9, movetoworkspace, 9 # [hidden]
bindd = Super+Shift, 0, $d move to workspace 10, movetoworkspace, 10 # [hidden]

$d=[$ws]
bindd = Super+Ctrl+Alt, L, $d move window to next relative workspace, movetoworkspace, r+1
bindd = Super+Ctrl+Alt, H, $d move window to previous relative workspace, movetoworkspace, r-1

$d=[$ws|Navigation]
bindd = Super, Right, $d next workspace, workspace, e+1
bindd = Super, Left, $d previous workspace, workspace, e-1

$d=[$ws|Navigation|Move window silently]
bindd = Super+Alt, 1, $d move to workspace 1  (silent), movetoworkspacesilent, 1
bindd = Super+Alt, 2, $d move to workspace 2  (silent), movetoworkspacesilent, 2
bindd = Super+Alt, 3, $d move to workspace 3  (silent), movetoworkspacesilent, 3
bindd = Super+Alt, 4, $d move to workspace 4  (silent), movetoworkspacesilent, 4
bindd = Super+Alt, 5, $d move to workspace 5  (silent), movetoworkspacesilent, 5
bindd = Super+Alt, 6, $d move to workspace 6  (silent), movetoworkspacesilent, 6
bindd = Super+Alt, 7, $d move to workspace 7  (silent), movetoworkspacesilent, 7
bindd = Super+Alt, 8, $d move to workspace 8  (silent), movetoworkspacesilent, 8
bindd = Super+Alt, 9, $d move to workspace 9  (silent), movetoworkspacesilent, 9
bindd = Super+Alt, 0, $d move to workspace 10 (silent), movetoworkspacesilent, 10

$d=#! unset the group name
