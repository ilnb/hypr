# see https://wiki.hyprland.org/configuring/keywords/ for more
# example binds, see https://wiki.hyprland.org/configuring/binds/ for more

# Grouping of binds for easier management
#  $d=[Group Name|Subgroup Name1|Subgroup Name2|...]
# '$d' is a variable that is used to group binds together (or use another variable)
# This is only for organization purposes and is not a defined hyprland variable
# What we did here is to modify the Description of the binds to include the group name
# The $d will be parsed as a separate key to be use for a GUI or something pretty
# [Main|Subgroup1|Subgroup2|...]
# Main - The main groupname
# Subgroup1.. - The subgroup names can be use to avoid repeating the same description

#*  Variables 
# Default if commented out
# Assign apps
$TERMINAL = wezterm.sh
$EDITOR = nvim
$EXPLORER = thunar
$BROWSER = zen-browser
$hydePath = $HOME/.local/lib/hyde

# modifications from the end4 config
unbind = Ctrl+Super+Alt, Right
unbind = Ctrl+Super+Alt, Left
unbind = Super, Page_Down
unbind = Super, Page_Up
unbind = Ctrl+Super, Page_Down
unbind = Ctrl+Super, Page_Up
unbind = Super, mouse_up
unbind = Super, mouse_down
unbind = Ctrl+Super, mouse_up
unbind = Ctrl+Super, mouse_down
unbind = Super, B
unbind = Super, O
unbind = Super, F
unbind = Super+Shift, C
unbind = Ctrl+Super, P

unbind = Super+Shift, B
unbind = Super+Shift, P
bindl = Super+Shift, P, exec, playerctl previous # Previous track
bindl= Super+Shift, Space, exec, playerctl play-pause # Play/pause media

unbind = Super, C
bind = Super, C, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "$hydePath/wezterm.sh start -- sh -c nvim" "command -v nvim && kitty -1 nvim" # Code editor

unbind = Super, D
unbind = Super+Shift, M
bind = Super, X, fullscreen, 1 # Maximize

unbind = Super, K
bindd = Super+Shift, K, Toggle on-screen keyboard, global, quickshell:oskToggle # Toggle on-screen keyboard

unbind = Super, J
bindd = Super+Shift, J, Toggle bar, global, quickshell:barToggle # Toggle bar

unbind = Super, L
unbind = Super+Shift, L
bindd = Super+Shift, L, Lock, exec, loginctl lock-session # Lock
bindld = Super+Alt, L, Suspend system, exec, systemctl suspend || loginctl suspend # Sleep

unbind = Super, Return
# bind = Super, Return, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "${TERMINAL}" "wezterm" "kitty -1" "ghostty" # Terminal
unbind = Super, T
# bind = Super, T, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "${TERMINAL}" "wezterm" "kitty -1" "ghostty" # [hidden] (terminal) (alt)
bindd = Super, T, terminal emulator, exec, $TERMINAL # Terminal emulator

unbind = Super, W
bind = Super, F, exec, ~/.config/hypr/hyprland/scripts/launch_first_available.sh "zen-browser" "firefox" "brave" "librewolf" # Browser

$wm=Window Management
$d=[$wm]
bindd = Alt, F4, $d force close focused window, forcekillactive
bindd = Super, Delete, $d kill hyprland session, exit
bindd = Super, W, $d toggle float, togglefloating, #
bindd = Super, G, $d toggle group, togglegroup
bindd = Alt, Return, $d toggle fullscreen, fullscreen, 0
bindd = Super+Shift, F, $d toggle pin on focused window, exec, $hydePath/windowpin.sh
bindd = Alt, Backspace, $d logout menu, exec, $hydePath/logoutlaunch.sh
bindd = Super, Backspace, $d logout menu, exec, $hydePath/logoutlaunch.sh

$wbar_reload = 1 # if variable is defined and not "", it's true
# hyprlang if wbar_reload
bindd = Alt_R, Control_R, $d toggle waybar and reload config, exec, killall waybar || (env reload_flag=1 $hydePath/wbarconfgen.sh)
# hyprlang endif
# hyprlang if !wbar_reload
bindd = Alt_R, Control_R, toggle waybar, exec, killall waybar || waybar # toggle waybar without reloading, this is faster
# hyprlang endif

$d=[$wm|Group Navigation]
bindd = Super+Alt_R, H, $d change active group backwards, changegroupactive, b
bindd = Super+Alt_R, L, $d change active group forwards, changegroupactive, f

$d=[$wm|Change focus]
bindd = Super, H, $d focus left, movefocus, l # [hidden]
bindd = Super, L, $d focus right , movefocus, r # [hidden]
bindd = Super, K, $d focus up , movefocus, u # [hidden]
bindd = Super, J, $d focus down, movefocus, d # [hidden]
bindd = Alt, TAB, $d focus , movefocus, d # [hidden]

$d=[$wm|Move active window across workspace]
$moveactivewindow=grep -q "true" <<< $(hyprctl activewindow -j | jq -r .floating) && hyprctl dispatch moveactive
bindde = Super+Ctrl, H, Move active window to the left, exec, $moveactivewindow -30 0 || hyprctl dispatch movewindow l # [hidden]
bindde = Super+Ctrl, L, Move active window to the right, exec, $moveactivewindow 30 0 || hyprctl dispatch movewindow r # [hidden]
bindde = Super+Ctrl, K, Move active window up, exec, $moveactivewindow  0 -30 || hyprctl dispatch movewindow u # [hidden]
bindde = Super+Ctrl, J, Move active window down, exec, $moveactivewindow 0 30 || hyprctl dispatch movewindow d # [hidden]

$d=[$wm|Move & Resize with mouse]
binddm = Super, mouse:272, $d hold to move window, movewindow
binddm = Super, mouse:273, $d hold to resize window, resizewindow
binddm = Super, Z, $d hold to move window, movewindow

# Toggle focused window split
$d=[$wm]
bindd = Super+Shift, J, $d toggle split, togglesplit

$l=Launcher
$d=[$l|Apps]
# bindd = Super+Shift, M, $d spotify (adblock), exec, env LD_PRELOAD=/usr/lib/spotify-adblock.so spotify --uri=%U
# bindd = Super+Shift, M, $d spotify, exec, spotify
bindd = Super+Shift, M, $d spotify, exec, flatpak run com.spotify.Client
# bindd = Super, D, $d discord, exec, env DISCORD_DISABLE_WAYLAND=1 discord
bindd = Super, D, $d discord, exec, vesktop

$d=[$l|Rofi menus]
$rofi-launch=$hydePath/rofilaunch.sh
bindd = Super, comma, $d glyph picker, exec, pkill -x rofi || $hydePath/glyph-picker.sh # launch glyph picker
bindd = Super, B, $d pdf selector, exec, pkill -x rofi || $hydePath/pdf-selector.sh # opens selected pdf in zathura
bindd = Super+Shift, B, $d pdf selector, exec, pkill -x rofi || $hydePath/pdf-selector.sh hidden # include all hidden dirs

$hc=Hardware Ctrls
$d=[$hc|Audio]
binddl  = , F10, $d toggle mute output, exec, wpctl set-mute @DEFAULT_SINK@ toggle # toggle audio mute
binddl  = , XF86AudioMute,$d  toggle mute output, exec, $hydePath/volumecontrol.sh -o m # toggle audio mute
binddel = , F11, $d decrease volume, exec, $hydePath/volumecontrol.sh -o d # decrease volume
binddel = , F12, $d increase volume, exec, $hydePath/volumecontrol.sh -o i # increase volume
binddl  = , XF86AudioMicMute,$d un/mute microphone, exec, $hydePath/volumecontrol.sh -i m # toggle microphone mute

$d=[$hc|Media]
binddl  = , XF86AudioPlay,$d play media, exec, playerctl play-pause # toggle between media play and pause
binddl  = , XF86AudioPause,$d pause media, exec, playerctl play-pause # toggle between media play and pause
binddl  = , XF86AudioNext,$d next media, exec, playerctl next # media next
binddl  = , XF86AudioPrev,$d  previous media, exec, playerctl previous # media previous

$d=[$hc|Brightness]
binddel = , XF86MonBrightnessUp, $d increase brightness, exec, $hydePath/brightnesscontrol.sh i # increase brightness
binddel = , XF86MonBrightnessDown, $d decrease brightness, exec, $hydePath/brightnesscontrol.sh d # decrease brightness

$ut=Utilities
$d=[$ut]
bindd = Super+Alt, G, $d game mode, exec, $hydePath/gamemode.sh # disable hypr effects for gamemode
bindd = Super+Shift, C, $d wayclick, exec, env WC_KB=1 $hydePath/wayclick.sh # Toggle wayclick

$d=[$ut|Screen Capture]
bindd = Super+Ctrl, P, $d color picker, exec, hyprpicker -a # Pick color (Hex) >> clipboard
bindd = Super, P, $d freeze and snip screen, exec, $hydePath/screenshot.sh sf # partial screenshot capture (frozen screen)
# binddl = Super+Alt, P, $d print monitor, exec, $hydePath/screenshot.sh m # monitor screenshot capture
binddl = , Print, $d print all monitors, exec, $hydePath/screenshot.sh p # all monitors screenshot capture

$ws=Workspaces
$d=[$ws|Navigation]
bindd = Super, 1, $d navigate to workspace 1, workspace, 1 # [hidden]
bindd = Super, 2, $d navigate to workspace 2, workspace, 2 # [hidden]
bindd = Super, 3, $d navigate to workspace 3, workspace, 3 # [hidden]
bindd = Super, 4, $d navigate to workspace 4, workspace, 4 # [hidden]
bindd = Super, 5, $d navigate to workspace 5, workspace, 5 # [hidden]
bindd = Super, 6, $d navigate to workspace 6, workspace, 6 # [hidden]
bindd = Super, 7, $d navigate to workspace 7, workspace, 7 # [hidden]
bindd = Super, 8, $d navigate to workspace 8, workspace, 8 # [hidden]
bindd = Super, 9, $d navigate to workspace 9 , workspace, 9 # [hidden]
bindd = Super, 0, $d navigate to workspace 10, workspace, 10 # [hidden]

$d=[$ws|Navigation|Relative workspace]
bindd = Super+Alt, n, $d change active workspace forwards, workspace, r+1
bindd = Super+Alt, p, $d change active workspace backwards, workspace, r-1

$d=[$ws|Navigation]
bindd = Super+Ctrl, Down, $d navigate to the nearest empty workspace, workspace, empty

$d=[$ws|Move window to workspace]
bindd = Super+Shift, 1, $d move to workspace 1, movetoworkspace, 1
bindd = Super+Shift, 2, $d move to workspace 2, movetoworkspace, 2
bindd = Super+Shift, 3, $d move to workspace 3, movetoworkspace, 3
bindd = Super+Shift, 4, $d move to workspace 4, movetoworkspace, 4
bindd = Super+Shift, 5, $d move to workspace 5, movetoworkspace, 5
bindd = Super+Shift, 6, $d move to workspace 6, movetoworkspace, 6
bindd = Super+Shift, 7, $d move to workspace 7, movetoworkspace, 7
bindd = Super+Shift, 8, $d move to workspace 8, movetoworkspace, 8
bindd = Super+Shift, 9, $d move to workspace 9, movetoworkspace, 9
bindd = Super+Shift, 0, $d move to workspace 10, movetoworkspace, 10

$d=[$ws]
bindd = Super+Ctrl+Alt, L, $d move window to next relative workspace, movetoworkspace, r+1
bindd = Super+Ctrl+Alt, H, $d move window to previous relative workspace, movetoworkspace, r-1

$d=[$ws|Navigation]
bindd = Super, Right, $d next workspace, workspace, e+1
bindd = Super, Left, $d previous workspace, workspace, e-1

$d=[$ws|Navigation|Move window silently]
bindd = Super+Alt, 1, $d move to workspace 1  (silent), movetoworkspacesilent, 1
bindd = Super+Alt, 2, $d move to workspace 2  (silent), movetoworkspacesilent, 2
bindd = Super+Alt, 3, $d move to workspace 3  (silent), movetoworkspacesilent, 3
bindd = Super+Alt, 4, $d move to workspace 4  (silent), movetoworkspacesilent, 4
bindd = Super+Alt, 5, $d move to workspace 5  (silent), movetoworkspacesilent, 5
bindd = Super+Alt, 6, $d move to workspace 6  (silent), movetoworkspacesilent, 6
bindd = Super+Alt, 7, $d move to workspace 7  (silent), movetoworkspacesilent, 7
bindd = Super+Alt, 8, $d move to workspace 8  (silent), movetoworkspacesilent, 8
bindd = Super+Alt, 9, $d move to workspace 9  (silent), movetoworkspacesilent, 9
bindd = Super+Alt, 0, $d move to workspace 10 (silent), movetoworkspacesilent, 10

$d=#! unset the group name
