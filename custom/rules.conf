# Disable blur for all xwayland apps
# windowrule = no_blur on, match:xwayland 1

windowrule = match:class .*, no_blur off
windowrule = match:class ^()$, match:title ^()$, no_blur off

# tags
windowrule = center on, match:tag center_float
windowrule = float on, match:tag center_float

# opacity - active, inactive, fullscreen
windowrule = match:class (firefox)$, opacity 0.90 override 0.90 override
windowrule = match:class (zen), opacity 0.80 override 0.80 override
windowrule = match:class (org.pwmt.zathura), opacity 0.75 override 0.80 override 0.70 override
