# common modals
windowrule = match:initial_title (.*)(Confirm to replace files)(.*)$, float on
windowrule = match:initial_title (.*)(File Operation Progress)(.*)$, float on

windowrule {
  name = file tile
  match:initial_title = (.*)(Rename)(.*)$
  match:initial_title = (.*)(Open)(.*)$
  match:initial_title = (.*)(Choose Files)(.*)$
  match:initial_title = (.*)(Save)(.*)$
  match:initial_title = (.*)(File Upload)(.*)$
  match:initial_title = (.*)(Opening)(.*)$
  size = 450 250
  tag = +center_float
}

# █░░ ▄▀█ █▄█ █▀▀ █▀█   █▀█ █░█ █░░ █▀▀ █▀
# █▄▄ █▀█ ░█░ ██▄ █▀▄   █▀▄ █▄█ █▄▄ ██▄ ▄█


layerrule {
  name = blurry
  blur = on
  match:namespace = rofi
  match:namespace = notifications
  match:namespace = swaync-notification-window
  match:namespace = swaync-control-center
  match:namespace = logout_dialog
}

layerrule {
  name = noalpha
  ignore_alpha = 0
  match:namespace = rofi
  match:namespace = notifications
  match:namespace = swaync-notification-window
  match:namespace = swaync-control-center
}
