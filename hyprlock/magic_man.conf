source=~/.config/hypr/hyprlock/colors.conf

# BACKGROUND
background {
  color = rgba(181818FF)
  path = $background_image
  blur_passes = 2
  contrast = 1
  brightness = 0.5
  vibrancy = 0.2
  vibrancy_darkness = 0.2
}

# GENERAL
general {
  no_fade_in = true
  no_fade_out = true
  hide_cursor = true
  grace = 0
  disable_loading_bar = true
}

# INPUT FIELD
input-field {
  monitor =
  size = 250, 60
  outline_thickness = 2
  dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
  dots_spacing = 0.35 # Scale of dots' size, 0.0 - 1.0
  dots_center = true
  outer_color = rgba(0, 0, 0, 0)
  inner_color = rgba(0, 0, 0, 0.2)
  font_color = rgba(200, 200, 200, 0.5)
  font_family = $font_family
  fade_on_empty = false
  rounding = -1
  check_color = rgb(204, 136, 34)
  placeholder_text = <span foreground="##cdd6f4">Say the spell</span>
  fail_color = rgba(FF0000FF)
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  fail_transition = 100
  hide_input = false
  position = 0, -100
  halign = center
  valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:1000] date +"%A, %B %d"
  color = rgba(242, 243, 244, 0.75)
  font_size = 22
  font_family = $font_family
  position = 0, 300
  halign = center
  valign = center
}

# TIME
label {
  monitor =
  text = $TIME
  color = $text_color
  font_size = 95
  font_family = $font_family Bold
  position = 0, 200
  halign = center
  valign = center
}

# USER AVATAR
label {
  monitor =
  text =     $USER
  color = $text_color
  outline_thickness = 2
  dots_size = 0.2 # Scale of input-field height, 0.2 - 0.8
  dots_spacing = 0.2 # Scale of dots' absolute size, 0.0 - 1.0
  dots_center = true
  font_size = 20
  font_family = $font_family
  position = 0, 50
  halign = center
  valign = bottom
}

# GREET
label {
  monitor =
  text = cmd[update:1000] echo "Hello there, magic man."
  outer_color = $entry_border_color
  inner_color = $entry_background_color
  font_color = $entry_color
  font_size = 20
  font_family = $font_family
  outline_thickness = 2
  position = 0, 0
  halign = center
  valign = center
}

# Battery Status if present
label { # Status
  monitor =
  text = cmd[update:5000] ${XDG_CONFIG_HOME:-$HOME/.config}/hypr/hyprlock/status.sh
  color = $text_color
  font_size = 14
  font_family = $font_family
  position = 30, -30
  halign = left
  valign = top
}
